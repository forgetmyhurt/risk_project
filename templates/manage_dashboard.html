{% extends "base.html" %}
{% block title %}后台管理 - 企业风险评估系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold m-0">系统后台管理</h5>
    <div class="btn-group btn-group-sm">
        <a href="{% url 'manager:dashboard' %}" class="btn btn-primary active">管理概览</a>
        <a href="{% url 'manager:users' %}" class="btn btn-outline-primary">用户与权限管理</a>
        <a href="{% url 'manager:threshold' %}" class="btn btn-outline-primary">风险阈值配置</a>
    </div>
</div>
<div class="row g-4">
    <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">企业档案库总量</div><h3 class="fw-bold mt-1">{{ ent_count }}</h3></div></div>
    <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">风险评分记录数</div><h3 class="fw-bold mt-1">{{ ind_count }}</h3></div></div>
    <div class="col-md-4"><div class="card border-0 shadow-sm p-3"><div class="text-muted small">注册系统用户数</div><h3 class="fw-bold mt-1">{{ user_count }}</h3></div></div>
</div>
{% endblock %}
