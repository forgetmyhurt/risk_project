<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录 - 企业风险评估系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    <div class="card shadow-sm border-0 p-4" style="width: 400px;">
        <h4 class="text-center fw-bold mb-4 text-primary">企业风险评估系统</h4>
        {% if error %}
            <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}
        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label small">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small">密码</label>
                <input type="password" name="password" class="form-control" placeholder="请输入密码" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" name="remember" value="1" class="form-check-input" id="rememberCheck">
                <label class="form-check-label small" for="rememberCheck">记住我（7 天内免登录）</label>
            </div>
            <button type="submit" class="btn btn-primary w-100">登 录</button>
        </form>
    </div>
</body>
</html>
