{% extends "base.html" %}
{% block title %}风险数据可视化 - 企业风险评估系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold m-0">风险数据可视化</h5>
    <div class="btn-group btn-group-sm">
        <a href="{% url 'dashboard:chart_enterprise' %}" class="btn btn-outline-primary">企业分布 (3图)</a>
        <a href="{% url 'dashboard:chart_risk' %}" class="btn btn-primary active">风险分布 (3图)</a>
        <a href="{% url 'dashboard:chart_compare' %}" class="btn btn-outline-primary">单企雷达对比 (1图)</a>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm p-3">
            <h6 class="fw-bold small mb-2">4. 风险等级构成（点击跳转对应等级企业列表）</h6>
            <div id="chartLevel" style="height: 320px;"></div>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card border-0 shadow-sm p-3">
            <h6 class="fw-bold small mb-2">5. 综合得分分布直方图（10 分一档分箱）</h6>
            <div id="chartHist" style="height: 320px;"></div>
        </div>
    </div>
    <div class="col-md-12">
        <div class="card border-0 shadow-sm p-3">
            <h6 class="fw-bold small mb-2">6. 各企业类型四维度平均得分对比</h6>
            <div id="chartGroup" style="height: 320px;"></div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
const cLevel = echarts.init(document.getElementById('chartLevel'));
cLevel.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c} 家 ({d}%)' },
    legend: { bottom: 0 },
    series: [{ type: 'pie', radius: ['45%', '70%'], data: {{ level_json|safe }} }]
});
cLevel.on('click', p => { if (p.data.level) window.location.href = `/enterprise/list/?level=${p.data.level}`; });

const cHist = echarts.init(document.getElementById('chartHist'));
cHist.setOption({
    tooltip: { trigger: 'axis' },
    xAxis: { type: 'category', data: {{ bins_json|safe }} },
    yAxis: { type: 'value' },
    series: [{ type: 'bar', barWidth: '65%', data: {{ bin_counts_json|safe }}, itemStyle: { color: '#6366f1' } }]
});

const cGroup = echarts.init(document.getElementById('chartGroup'));
cGroup.setOption({
    tooltip: { trigger: 'axis' },
    legend: { top: 0 },
    xAxis: { type: 'category', data: {{ t_labels_json|safe }} },
    yAxis: { type: 'value', max: 25 },
    series: [
        { name: '财务维度', type: 'bar', data: {{ fin_json|safe }} },
        { name: '经营维度', type: 'bar', data: {{ ope_json|safe }} },
        { name: '合规维度', type: 'bar', data: {{ com_json|safe }} },
        { name: '质量维度', type: 'bar', data: {{ qua_json|safe }} }
    ]
});
</script>
{% endblock %}
