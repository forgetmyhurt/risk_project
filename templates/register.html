<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册账号 - 企业风险评估系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh; margin: 0; font-family: "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 15% 20%, #1e3a8a 0%, #0f172a 55%, #020617 100%);
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .auth-wrapper {
            width: 920px; max-width: 100%; background: rgba(255, 255, 255, 0.96);
            border-radius: 28px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
            overflow: hidden; display: flex;
        }
        .auth-brand {
            width: 42%; background: linear-gradient(145deg, #1d4ed8 0%, #1e3a8a 50%, #0f172a 100%);
            color: #fff; padding: 44px 36px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .auth-form-box { width: 58%; padding: 40px 44px; }
        .form-control-custom {
            border-radius: 10px; padding: 10px 14px; font-size: 13px;
            border: 1.5px solid #e2e8f0; background-color: #f8fafc;
        }
        .form-control-custom:focus {
            background-color: #fff; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }
        .btn-auth {
            border-radius: 10px; padding: 11px; font-weight: 600;
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%); border: none;
        }
        @media (max-width: 768px) {
            .auth-brand { display: none; }
            .auth-form-box { width: 100%; padding: 32px 24px; }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-brand">
            <div>
                <div class="d-flex align-items-center gap-2 mb-3">
                    <span class="fs-3">🛡️</span>
                    <span class="fs-5 fw-bold">企业风险评估系统</span>
                </div>
                <p class="text-white-50 small">注册风控尽调员账号，即刻开启企业工商全景检索、四维风险评级与智能辅助评估。</p>
            </div>
            <div class="text-white-50 small">Enterprise Risk Intelligence Platform v2.0</div>
        </div>

        <div class="auth-form-box">
            <h5 class="fw-bold text-dark mb-1">注册风控工作台账号</h5>
            <p class="text-muted small mb-3">新注册账号默认授予“普通风控专员”权限</p>

            {% if messages %}
                {% for msg in messages %}
                    <div class="alert alert-{% if msg.tags == 'error' %}danger{% else %}{{ msg.tags }}{% endif %} py-2 small">{{ msg }}</div>
                {% endfor %}
            {% endif %}
            {% if error %}
                <div class="alert alert-danger py-2 small">{{ error }}</div>
            {% endif %}

            <form method="post" autocomplete="off">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">用户名 *</label>
                        <input type="text" name="username" class="form-control form-control-custom" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">所属部门</label>
                        <input type="text" name="department" class="form-control form-control-custom" placeholder="如：信贷审批部">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">电子邮箱</label>
                        <input type="email" name="email" class="form-control form-control-custom" placeholder="name@example.com">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">联系电话</label>
                        <input type="text" name="phone" class="form-control form-control-custom" placeholder="11位手机号码">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">设置密码 *</label>
                        <input type="password" name="password" class="form-control form-control-custom" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-semibold">确认密码 *</label>
                        <input type="password" name="password_confirm" class="form-control form-control-custom" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-auth w-100 text-white mt-4 mb-3">提交注册</button>
            </form>

            <div class="text-center small text-muted">
                已有账号？ <a href="{% url 'accounts:login' %}" class="text-primary fw-semibold text-decoration-none">返回登录</a>
            </div>
        </div>
    </div>
</body>
</html>
